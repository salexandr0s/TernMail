name: Tern
options:
  bundleIdPrefix: dev.tern
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Tern:
    type: application
    platform: macOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tern
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: Google sign-in redirect
            CFBundleURLSchemes:
              - $(GOOGLE_REDIRECT_SCHEME)
        TernGoogleClientID: $(GOOGLE_CLIENT_ID)
        TernGoogleClientIDPrefix: $(GOOGLE_CLIENT_ID_PREFIX)
        TernGoogleRedirectScheme: $(GOOGLE_REDIRECT_SCHEME)
    entitlements:
      path: App/Tern.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tern.mail
        PRODUCT_NAME: Tern
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
