name: Tern
options:
  bundleIdPrefix: dev.tern
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  Core:
    path: Packages/Core
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    exactVersion: 3.0.0
targets:
  Tern:
    type: application
    platform: macOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tern
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        TernGoogleClientID: $(GOOGLE_CLIENT_ID)
        TernGoogleClientIDPrefix: $(GOOGLE_CLIENT_ID_PREFIX)
        TernGoogleRedirectScheme: $(GOOGLE_REDIRECT_SCHEME)
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: Tern.sdef
        CFBundleURLTypes:
          - CFBundleURLName: dev.tern.mail.links
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - mailto
              - tern
          - CFBundleURLName: dev.tern.mail.google
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(GOOGLE_REDIRECT_SCHEME)
    entitlements:
      path: App/Tern.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Temporary OAuth callback, bound to 127.0.0.1 by LoopbackAuthListener.
        com.apple.security.network.server: true
        # Attaching chosen files, and saving received ones where the user picks.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tern.mail
        PRODUCT_NAME: Tern
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: Core
        product: GmailAPI
      - package: Core
        product: MailStore
      - package: Core
        product: MessageContent
      - package: Core
        product: SyncEngine
      - package: Core
        product: TernAI
      - package: Core
        product: IMAPIdle
      - package: AppAuth
        product: AppAuth
  TernTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tern.mail.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - target: Tern
      - package: Core
        product: MailStore
schemes:
  Tern:
    build:
      targets:
        Tern: all
    test:
      commandLineArguments:
        --ui-audit: true
      targets:
        - TernTests
