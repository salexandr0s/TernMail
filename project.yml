name: Tern
options:
  bundleIdPrefix: dev.tern
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
configs:
  Debug: debug
  Debug-Testing: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Debug-Testing: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "$(TERN_CODE_SIGN_IDENTITY)"
    DEVELOPMENT_TEAM: "$(TERN_DEVELOPMENT_TEAM)"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # The app's bundle ID. ClaudeHelper gets the same value in its Info.plist and
    # accepts XPC connections only from an app signed with this identifier.
    TERN_APP_BUNDLE_IDENTIFIER: dev.tern.mail
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # Hosted and UI tests run in this configuration. It compiles the test and
    # audit support, and its app has its own bundle ID, so it gets its own
    # container and Keychain items. Xcode builds Swift packages with their
    # debug settings only when the configuration name starts with Debug, and
    # the tests' @testable imports of package modules need those settings.
    Debug-Testing:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG TERN_TEST_SUPPORT
      TERN_APP_BUNDLE_IDENTIFIER: dev.tern.mail.testing
packages:
  Core:
    path: Packages/Core
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    exactVersion: 3.0.0
targets:
  Tern:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tern
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        TernBuildRevision: $(TERN_BUILD_REVISION)
        TernGoogleClientID: $(GOOGLE_CLIENT_ID)
        TernGoogleClientIDPrefix: $(GOOGLE_CLIENT_ID_PREFIX)
        TernGoogleRedirectScheme: $(GOOGLE_REDIRECT_SCHEME)
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: Tern.sdef
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.tern.mail.conversation
            UTTypeDescription: Tern Conversation
            UTTypeConformsTo:
              - public.data
        # Services menu items, handled by MailServices. An empty
        # NSRequiredContext turns them on without a trip to Keyboard Settings.
        NSServices:
          - NSMenuItem:
              default: New Tern Message with Selection
            NSMessage: newMessageWithSelection
            NSPortName: Tern
            NSRequiredContext: {}
            NSSendTypes:
              - public.plain-text
          - NSMenuItem:
              default: New Tern Message to Address
            NSMessage: newMessageToAddress
            NSPortName: Tern
            NSRequiredContext: {}
            NSSendTypes:
              - public.plain-text
        CFBundleURLTypes:
          - CFBundleURLName: dev.tern.mail.links
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - mailto
              - tern
          - CFBundleURLName: dev.tern.mail.google
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(GOOGLE_REDIRECT_SCHEME)
        NSUserActivityTypes:
          - dev.tern.mail.conversation
          - dev.tern.calendar.day
    entitlements:
      path: App/Tern.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Temporary OAuth callback, bound to 127.0.0.1 by LoopbackAuthListener.
        com.apple.security.network.server: true
        # Attaching chosen files, and saving received ones where the user picks.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TERN_APP_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: Tern
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Google rejects this client ID, so the Debug-Testing app cannot sign
        # in, and its redirect scheme differs from the one the real app
        # registers.
        Debug-Testing:
          GOOGLE_CLIENT_ID_PREFIX: tern-testing-no-client
          GOOGLE_CLIENT_ID: tern-testing-no-client.apps.googleusercontent.com
          GOOGLE_REDIRECT_SCHEME: com.googleusercontent.apps.tern-testing-no-client
    dependencies:
      - target: ClaudeHelper
        embed: true
        codeSign: true
      - package: Core
        product: GmailAPI
      - package: Core
        product: MailStore
      - package: Core
        product: MessageContent
      - package: Core
        product: SyncEngine
      - package: Core
        product: TernAI
      - package: Core
        product: IMAPIdle
      - package: Core
        product: Diagnostics
      - package: AppAuth
        product: AppAuth
  ClaudeHelper:
    type: xpc-service
    platform: macOS
    sources:
      - ClaudeHelper
      - Shared
    info:
      path: ClaudeHelper/Info.plist
      properties:
        TernHostBundleIdentifier: $(TERN_APP_BUNDLE_IDENTIFIER)
        XPCService:
          ServiceType: Application
          JoinExistingSession: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tern.mail.ClaudeHelper
        PRODUCT_NAME: ClaudeHelper
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - package: Core
        product: TernAI
  ClaudeHelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClaudeHelper
        excludes:
          - main.swift
          - Info.plist
      - Shared
      - Tests/ClaudeHelperTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tern.mail.ClaudeHelper.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: Core
        product: TernAI
  TernTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tern.mail.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tern
      - package: Core
        product: MailStore
  TernUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tern.mail.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tern
schemes:
  Tern:
    build:
      targets:
        Tern: all
    run:
      config: Debug
    test:
      config: Debug-Testing
      commandLineArguments:
        --ui-audit: true
      targets:
        - TernTests
        - ClaudeHelperTests
        - TernUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
